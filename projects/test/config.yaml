# Text file input
txtInput1:
  type: inputTXT
  name: BBC_dataset
  source: bbc-fulltext/bbc
  output: corpus_bbc.json
  emptyLineSplit: false

buildText1:
  type: buildText
  corpus: corpus_bbc.json
  textFields: [ text ]
  docFields: [ folder, file ]

lemmatise1:
  type: lemmatise
  corpus: corpus_bbc.json

ngramsAnalysis1:
  type: nGrams
  size: 2
  corpus: corpus_bbc.json
  nGrams: nGrams.csv
  analysis: true

ngramsBuild1:
  type: nGrams
  corpus: corpus_bbc.json
  nGrams: nGrams.txt
  analysis: false

ldaModel1:
  type: modelLDA
  name: main
  corpus: corpus_bbc.json
  topics: model_bbc_main.json
  documents: corpus_bbc.json
  nTopics: 5
  iterations: 100

ldaModel2:
  type: modelLDA
  name: sub
  corpus: corpus_bbc.json
  topics: model_bbc_sub.json
  documents: corpus_bbc.json
  nTopics: 10
  iterations: 100

topicSim1:
  type: topicSimilarity
  topics: model_bbc_main.json
  output: main_topic_similarities.json

topicSim2:
  type: topicSimilarity
  topics: model_bbc_sub.json
  output: sub_topic_similarities.json

topicSim3:
  type: topicSimilarity
  topics: [model_bbc_main.json, model_bbc_sub.json]
  similarity: "average_jaccard"
  output: topic_similarities.json

topicClust1:
  type: topicCluster
  similarities: main_topic_similarities.json
  output: main_topic_clusters.json
  linkage: "max"
  clusters: 3


# BiBTex input module
bibInput2:
  type: inputBIB
  source: bib_input.bib
  output: corpus_bib.json
  fields:
    authors: author
    title: title
    abstract: abstract
    keywords: keywords
    year: year
    doi: doi

buildText2:
  type: buildText
  corpus: corpus_bib.json
  textFields: [ title, abstract, keywords ]
  docFields: [ author, year ]

lemmatise2:
  type: lemmatise
  corpus: corpus_bib.json

ngrams2:
  type: nGrams
  size: 2
  corpus: corpus_bib.json

ldaModel3:
  type: modelLDA
  corpus: corpus_csv.json
  model: model.json
  topics: 2
  iterations: 500
  wordDistances: true
  logs: modelLogs

# CSV input module
csvInput1:
  type: inputCSV
  source: csv_input_1.csv
  output: corpus_csv_1.json
  fields:
    title: title
    abstract: abs
    authors: auth
    organisation: org
    value: val

csvInput2:
  type: inputCSV
  name: csv_test
  source: csv_input_2.csv
  output: corpus_csv_2.json
  fields:
    title: title
    abstract: abs
    authors: auth
    organisation: org
    value: val

mergeCorpus1:
  type: mergeCorpus
  name: csv_example
  corpora: [ corpus_csv_1.json, corpus_csv_2.json ]
  output: corpus_csv.json
  docFields: [ title, abstract, authors, organisation, value ]

